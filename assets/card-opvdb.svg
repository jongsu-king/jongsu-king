<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="OPV-DB: Single-junction organic PV device records. Derived from Qiu's OPV-DB (CC BY 4.0), merged and filtered.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-size:13px;fill:#A88034;letter-spacing:1.4px}
.name{font-weight:700;fill:#FFB000}
.desc{font-size:15px;fill:#E8DCC0}
.tag{font-size:12.5px;fill:#A88034;letter-spacing:.6px}
.lab{font-size:13px;font-weight:700;fill:#FFB000}
.val{font-size:15px;fill:#E8DCC0}
.ax{font-size:11.5px;fill:#A88034}
.trace{fill:none;stroke:#FFB000;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ghost{fill:none;stroke:#FFB000;stroke-width:5;opacity:.4;filter:url(#glow)}
.teal{fill:none;stroke:#4FD1C5;stroke-width:1.2}
.dimline{fill:none;stroke:#A88034;stroke-width:1.2}
.cover{fill:#0C0B08;transform:translateX(552px);animation:sweep 11s linear infinite}
.beam{stroke:#FFECBE;stroke-width:1.6;opacity:0;animation:beam 11s linear infinite}
.spin{animation:spin 7s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}32%,100%{transform:translateX(552px)}}
@keyframes beam{0%{transform:translateX(0);opacity:1}32%{transform:translateX(552px);opacity:1}32.01%,100%{transform:translateX(552px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cover,.beam,.spin,.pulse{animation:none}}
</style>
<defs><filter id="glow" x="-5%" y="-20%" width="110%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>
<clipPath id="plot"><rect x="24" y="70" width="552" height="162"/></clipPath></defs>
<rect x="1" y="1" width="598" height="338" rx="14" fill="#0C0B08" stroke="#2E2818" stroke-width="2"/>
<text x="24.0" y="30.0" class="kick" text-anchor="start" >LITERATURE-MINED DATASET</text><text x="576.0" y="30.0" class="kick" text-anchor="end" >CSV</text>
<text x="24" y="58" class="name" font-size="26">OPV-DB</text>
<g clip-path="url(#plot)">
<g><text x="40.0" y="92.0" class="ax" text-anchor="start" style="font-size:13px;fill:#E8DCC0">Full archive</text><rect x="40" y="99" width="420.0" height="18" fill="#FFB000" fill-opacity="1.0"/><text x="470.0" y="113.0" class="lab" text-anchor="start" style="font-size:15px">38,849</text><text x="40.0" y="138.0" class="ax" text-anchor="start" style="font-size:13px;fill:#E8DCC0">Strict performance benchmark</text><rect x="40" y="145" width="339.0" height="18" fill="#FFB000" fill-opacity="0.72"/><text x="389.0" y="159.0" class="lab" text-anchor="start" style="font-size:15px">31,360</text><text x="40.0" y="184.0" class="ax" text-anchor="start" style="font-size:13px;fill:#E8DCC0">Strict molecular benchmark</text><rect x="40" y="191" width="234.8" height="18" fill="#FFB000" fill-opacity="0.45"/><text x="284.8" y="205.0" class="lab" text-anchor="start" style="font-size:15px">21,720</text></g>
<rect class="cover" x="24" y="70" width="552" height="162"/>
<g fill="none" stroke="#201C12"><path d="M70.0 70 V232"/><path d="M116.0 70 V232"/><path d="M162.0 70 V232"/><path d="M208.0 70 V232"/><path d="M254.0 70 V232"/><path d="M300.0 70 V232"/><path d="M346.0 70 V232"/><path d="M392.0 70 V232"/><path d="M438.0 70 V232"/><path d="M484.0 70 V232"/><path d="M530.0 70 V232"/><path d="M24 110.5 H576"/><path d="M24 151.0 H576"/><path d="M24 191.5 H576"/></g>
<path class="beam" d="M24 70 V232"/>
</g>
<rect x="24" y="70" width="552" height="162" fill="none" stroke="#2E2818"/>
<text x="24.0" y="262.0" class="desc" text-anchor="start" >Single-junction organic PV device records. Derived from</text><text x="24.0" y="283.0" class="desc" text-anchor="start" >Qiu's OPV-DB (CC BY 4.0), merged and filtered.</text><text x="24.0" y="312.0" class="tag" text-anchor="start" >MOLECULAR ⊂ PERFORMANCE ⊂ FULL · SMILES</text>
</svg>
