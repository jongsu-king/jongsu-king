<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 320" width="1224" height="320" role="img" aria-label="SwingLab: Native iPhone golf lab: swing video with Vision pose, an experimental launch monitor, a club catalog since 2000 and course strategy. Honest provenance, 12 languages.">
<style>
text{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.kick{font-size:13px;fill:#A88034;letter-spacing:1.4px}
.name{font-weight:700;fill:#FFB000}
.desc{font-size:15px;fill:#E8DCC0}
.tag{font-size:12.5px;fill:#A88034;letter-spacing:.6px}
.lab{font-size:13px;font-weight:700;fill:#FFB000}
.val{font-size:15px;fill:#E8DCC0}
.ax{font-size:11.5px;fill:#A88034}
.trace{fill:none;stroke:#FFB000;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ghost{fill:none;stroke:#FFB000;stroke-width:5;opacity:.4;filter:url(#glow)}
.teal{fill:none;stroke:#4FD1C5;stroke-width:1.2}
.dimline{fill:none;stroke:#A88034;stroke-width:1.2}
.cover{fill:#0C0B08;transform:translateX(1176px);animation:sweep 11s linear infinite}
.beam{stroke:#FFECBE;stroke-width:1.6;opacity:0;animation:beam 11s linear infinite}
.spin{animation:spin 7s linear infinite}
.pulse{animation:pulse 2.4s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(0)}32%,100%{transform:translateX(1176px)}}
@keyframes beam{0%{transform:translateX(0);opacity:1}32%{transform:translateX(1176px);opacity:1}32.01%,100%{transform:translateX(1176px);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.cover,.beam,.spin,.pulse{animation:none}}
</style>
